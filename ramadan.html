<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رمضان</title>
  <style>
    :root{
      --bg1:#0b1b2a; --bg2:#0b2a2d;
      --card: rgba(255,255,255,.14);
      --border: rgba(255,255,255,.18);
      --text:#fff; --muted: rgba(255,255,255,.75);
      --shadow: 0 12px 40px rgba(0,0,0,.25);
      --ok: rgba(0,255,170,.25);
      --warn: rgba(255,200,0,.20);
      --today: rgba(0,170,255,.22);
    }
    body{
      margin:0; min-height:100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 20%, rgba(255,255,255,.20), transparent 60%),
        radial-gradient(900px 500px at 80% 40%, rgba(255,255,255,.12), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display:flex; justify-content:center; align-items:flex-start;
      padding:22px;
    }
    .wrap{ width:min(1100px,100%); }

    .top{
      text-align:center; margin-bottom:14px;
    }
    .dateLine{
      font-size:18px; font-weight:800; color:var(--muted);
      margin-bottom:6px;
    }
    .clock{
      font-weight:900; letter-spacing:1px;
      font-size: clamp(44px, 7vw, 92px);
      text-shadow: 0 6px 18px rgba(0,0,0,.35);
    }
    .badge{
      display:inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.10);
      color: var(--muted);
      font-weight:800;
      margin-top: 8px;
    }

    .grid{
      display:grid; gap:14px;
      grid-template-columns: 1fr 1fr;
      margin-top: 14px;
    }
    @media (max-width: 860px){ .grid{ grid-template-columns: 1fr; } }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 16px;
    }
    .card h2{
      margin:0 0 10px;
      font-size:18px;
      font-weight:900;
    }

    .center{ text-align:center; }
    .label{ color:var(--muted); font-weight:800; }
    .bigTitle{ font-size:32px; font-weight:950; margin: 8px 0 4px; }
    .small{ color:var(--muted); font-weight:800; }

    .pills{
      margin-top: 10px;
      display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    }
    .pill{
      width: 110px;
      background: rgba(255,255,255,.14);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      text-align:center;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }
    .pill .num{ font-size:30px; font-weight:950; line-height:1; }
    .pill .txt{ margin-top:6px; color:var(--muted); font-weight:800; }

    .stats{
      display:flex; gap:10px; flex-wrap:wrap;
      margin-top:10px;
      justify-content:space-between;
    }
    .stat{
      flex: 1 1 160px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,.10);
    }
    .stat .k{ color:var(--muted); font-weight:850; }
    .stat .v{ margin-top:6px; font-size:22px; font-weight:950; }

    .tableWrap{
      max-height: 520px;
      overflow:auto;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.10);
    }
    table{
      width:100%;
      border-collapse: collapse;
      min-width: 620px;
    }
    th, td{
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      text-align:right;
      font-weight:800;
    }
    th{ color: var(--muted); position: sticky; top: 0; background: rgba(0,0,0,.25); backdrop-filter: blur(8px); }
    tr.done{ opacity: .55; text-decoration: line-through; }
    tr.today{ background: var(--today); }
    tr:hover{ background: rgba(255,255,255,.08); }

    .tag{
      display:inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.10);
      color: var(--muted);
      font-weight:900;
      font-size: 12px;
      white-space:nowrap;
    }
    .tag.ok{ background: var(--ok); color: rgba(255,255,255,.9); }
    .tag.warn{ background: var(--warn); color: rgba(255,255,255,.9); }

    .foot{
      margin-top: 12px;
      text-align:center;
      color: rgba(255,255,255,.7);
      font-weight:800;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="dateLine" id="dateLine">—</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="badge" id="metaLine">—</div>
    </div>

    <div class="grid">
      <div class="card center">
        <div class="label">الأذان التالي</div>
        <div class="bigTitle" id="nextName">—</div>
        <div class="small" id="nextAt">—</div>

        <div class="label" style="margin-top:10px">الوقت المتبقي</div>
        <div class="pills">
          <div class="pill"><div class="num" id="h">--</div><div class="txt">ساعة</div></div>
          <div class="pill"><div class="num" id="m">--</div><div class="txt">دقيقة</div></div>
          <div class="pill"><div class="num" id="s">--</div><div class="txt">ثانية</div></div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="k">اليوم من رمضان</div>
            <div class="v" id="ramDay">—</div>
          </div>
          <div class="stat">
            <div class="k">الأيام المتبقية</div>
            <div class="v" id="daysLeft">—</div>
          </div>
          <div class="stat">
            <div class="k">الإفطار اليوم (المغرب)</div>
            <div class="v" id="iftarToday">—</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>روزنامة رمضان (الإمساك / الإفطار)</h2>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>اليوم</th>
                <th>التاريخ (ميلادي)</th>
                <th>الإمساك (الفجر)</th>
                <th>الإفطار (المغرب)</th>
                <th>الحالة</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="foot">الأيام اللي تمت تنشطب تلقائيًا ✅ واليوم الحالي يبين بلون مختلف.</div>
      </div>
    </div>
  </div>

<script>
/* ===================== إعداداتك ===================== */

// مدينة / عنوان
const CITY_NAME = "البصرة";
const TIME_ZONE = "Asia/Baghdad";

// تاريخ أول يوم رمضان (ميلادي) — عدّله حسب سنة رمضان عندك
// مثال: 2026-02-18 (مجرد مثال) — أنت غيّره للصحيح
const RAMADAN_START_GREG = "2026-02-18";

// عدد أيام رمضان (عادة 29 أو 30) — خله 30 إذا تريد جدول كامل
const RAMADAN_DAYS = 30;

/*
  جدول الأوقات لكل يوم.
  IMPORTANT: الأفضل تخليها بصيغة 24 ساعة:
    fajr: "05:01"
    maghrib: "17:57"

  إذا عندك بصيغة "ص/م" يمشي هم:
    "5:01 ص"
    "5:57 م"
*/
const ramadanTimes = Array.from({length: RAMADAN_DAYS}, (_, i) => {
  // 🔁 هذا مجرد مثال ثابت — استبدله بجدول مدينتك الحقيقي لو عندك
  return {
    fajr: "05:01",     // الإمساك
    maghrib: "17:57"   // الإفطار
  };
});

// ترتيب صلوات اليوم لاختيار “الأذان التالي”
const PRAYER_ORDER = [
  { key: "fajr",    name: "أذان الفجر" },
  { key: "dhuhr",   name: "أذان الظهر" },
  { key: "asr",     name: "أذان العصر" },
  { key: "maghrib", name: "أذان المغرب (الإفطار)" },
  { key: "isha",    name: "أذان العشاء" },
];

/* ضع أوقات الظهر/العصر/العشاء (اليوم) — لو تريدها ثابتة */
const fixedOtherPrayers = {
  dhuhr: "12:10",
  asr:   "15:35",
  isha:  "19:15"
};


/* ===================== أدوات وقت/تاريخ بتوقيت محدد ===================== */

function nowInTZ(tz){
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: tz,
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit",
    hour12: false
  }).formatToParts(new Date());

  const get = (t) => parts.find(p => p.type === t)?.value;
  return new Date(`${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}:${get("second")}`);
}

function pad2(n){ return String(n).padStart(2,"0"); }

function to24h(timeStr){
  const s = String(timeStr).trim();

  // 24h
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;

  // Arabic ص/م
  let m = s.match(/^(\d{1,2}):(\d{2})\s*(ص|م)$/);
  if (m){
    let h = parseInt(m[1],10);
    const min = m[2];
    const mer = m[3];
    if (mer === "م" && h !== 12) h += 12;
    if (mer === "ص" && h === 12) h = 0;
    return `${pad2(h)}:${min}`;
  }

  // English AM/PM
  m = s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (m){
    let h = parseInt(m[1],10);
    const min = m[2];
    const mer = m[3].toUpperCase();
    if (mer === "PM" && h !== 12) h += 12;
    if (mer === "AM" && h === 12) h = 0;
    return `${pad2(h)}:${min}`;
  }

  throw new Error("صيغة وقت غير مدعومة: " + timeStr);
}

function makeDateInTZ(baseNow, tz, dateISO, hhmm){
  // baseNow فقط حتى نضمن نفس اليوم/السنة من tz
  // dateISO: "YYYY-MM-DD"
  const t24 = to24h(hhmm);
  return new Date(`${dateISO}T${t24}:00`);
}

function diffParts(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  return {h,m,s};
}

function formatTime12(date){
  const h = date.getHours();
  const m = date.getMinutes();
  const mer = h >= 12 ? "م" : "ص";
  const hh = ((h + 11) % 12) + 1;
  return `${hh}:${pad2(m)} ${mer}`;
}

/* ===================== حساب يوم رمضان + بناء الجدول ===================== */

function gregDateISOFromStart(dayIndex){
  const start = new Date(RAMADAN_START_GREG + "T00:00:00");
  const d = new Date(start.getTime() + dayIndex * 86400000);
  const y = d.getFullYear();
  const m = pad2(d.getMonth()+1);
  const da = pad2(d.getDate());
  return `${y}-${m}-${da}`;
}

function getRamadanDayIndex(nowTZ){
  // يحسب رقم اليوم (0-based) حسب تاريخ tz
  const todayISO = new Intl.DateTimeFormat("en-CA", { timeZone: TIME_ZONE, year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
  const start = new Date(RAMADAN_START_GREG + "T00:00:00");
  const today = new Date(todayISO + "T00:00:00");
  const diffDays = Math.floor((today - start) / 86400000);
  return diffDays; // قد يكون <0 قبل رمضان أو >=RAMADAN_DAYS بعده
}

function buildTable(nowTZ){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  const dayIndex = getRamadanDayIndex(nowTZ);

  for (let i=0; i<RAMADAN_DAYS; i++){
    const iso = gregDateISOFromStart(i);
    const times = ramadanTimes[i] || {fajr:"—", maghrib:"—"};

    const tr = document.createElement("tr");

    // شطب الأيام اللي تمت
    if (i < dayIndex) tr.classList.add("done");
    // تمييز اليوم الحالي
    if (i === dayIndex) tr.classList.add("today");

    const status =
      i < dayIndex ? `<span class="tag ok">تم</span>` :
      i === dayIndex ? `<span class="tag warn">اليوم</span>` :
      `<span class="tag">متبقي</span>`;

    tr.innerHTML = `
      <td>اليوم ${i+1}</td>
      <td>${iso}</td>
      <td>${times.fajr}</td>
      <td>${times.maghrib}</td>
      <td>${status}</td>
    `;
    tbody.appendChild(tr);
  }
}

/* ===================== الأذان التالي لليوم ===================== */

function getNextPrayer(nowTZ, todayISO, todayTimes){
  // todayTimes: fajr/maghrib + fixedOtherPrayers
  const merged = { ...fixedOtherPrayers, ...todayTimes };

  const items = PRAYER_ORDER.map(p => {
    const t = merged[p.key];
    const date = makeDateInTZ(nowTZ, TIME_ZONE, todayISO, t);
    return { key:p.key, name:p.name, date };
  }).sort((a,b)=>a.date-b.date);

  let next = items.find(x => x.date > nowTZ);

  if (!next){
    // فجر الغد
    const tomorrow = new Date(new Date(todayISO + "T00:00:00").getTime() + 86400000);
    const y = tomorrow.getFullYear();
    const m = pad2(tomorrow.getMonth()+1);
    const d = pad2(tomorrow.getDate());
    const tomorrowISO = `${y}-${m}-${d}`;
    const fajrT = merged.fajr;
    next = {
      key: "fajr",
      name: "أذان الفجر (غدًا)",
      date: makeDateInTZ(nowTZ, TIME_ZONE, tomorrowISO, fajrT)
    };
  }

  return next;
}

/* ===================== تحديث الواجهة ===================== */

function update(){
  const nowTZ = nowInTZ(TIME_ZONE);

  // التاريخ (ميلادي + هجري)
  const greg = new Intl.DateTimeFormat("ar-IQ", {
    timeZone: TIME_ZONE, weekday:"long", year:"numeric", month:"long", day:"numeric"
  }).format(new Date());

  const hijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic", {
    timeZone: TIME_ZONE, weekday:"long", year:"numeric", month:"long", day:"numeric"
  }).format(new Date());

  document.getElementById("dateLine").textContent = `${greg} — ${hijri}`;

  // الساعة
  document.getElementById("clock").textContent =
    `${pad2(nowTZ.getHours())}:${pad2(nowTZ.getMinutes())}:${pad2(nowTZ.getSeconds())}`;

  // تحديد اليوم من رمضان
  const dayIndex = getRamadanDayIndex(nowTZ);
  const ramDayEl = document.getElementById("ramDay");
  const leftEl = document.getElementById("daysLeft");
  const meta = document.getElementById("metaLine");

  if (dayIndex < 0){
    ramDayEl.textContent = "قبل رمضان";
    leftEl.textContent = "—";
    meta.textContent = `توقيت: ${CITY_NAME} — ${TIME_ZONE}`;
  } else if (dayIndex >= RAMADAN_DAYS){
    ramDayEl.textContent = "انتهى رمضان";
    leftEl.textContent = "0";
    meta.textContent = `توقيت: ${CITY_NAME} — ${TIME_ZONE}`;
  } else {
    ramDayEl.textContent = `${dayIndex+1} / ${RAMADAN_DAYS}`;
    leftEl.textContent = `${RAMADAN_DAYS - (dayIndex+1)}`;
    meta.textContent = `توقيت: ${CITY_NAME} — اليوم ${dayIndex+1}`;
  }

  // بناء الجدول (مرة كل تحديث - خفيف، وإذا تريد أخف نخليه كل دقيقة)
  buildTable(nowTZ);

  // إذا داخل رمضان: احسب الأذان التالي + المتبقي
  const todayISO = new Intl.DateTimeFormat("en-CA", {
    timeZone: TIME_ZONE, year:"numeric", month:"2-digit", day:"2-digit"
  }).format(new Date());

  let todayTimes = { fajr: "05:00", maghrib: "17:45" };
  if (dayIndex >= 0 && dayIndex < RAMADAN_DAYS){
    todayTimes = ramadanTimes[dayIndex];
  }

  // الإفطار اليوم
  document.getElementById("iftarToday").textContent = (dayIndex>=0 && dayIndex<RAMADAN_DAYS) ? todayTimes.maghrib : "—";

  const next = getNextPrayer(nowTZ, todayISO, todayTimes);
  document.getElementById("nextName").textContent = next.name;
  document.getElementById("nextAt").textContent = `موعده: ${formatTime12(next.date)}`;

  const parts = diffParts(next.date - nowTZ);
  document.getElementById("h").textContent = pad2(parts.h);
  document.getElementById("m").textContent = pad2(parts.m);
  document.getElementById("s").textContent = pad2(parts.s);
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
