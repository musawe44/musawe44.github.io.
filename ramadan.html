<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رمضان — الإمساك والإفطار</title>

  <!-- ضع أيقونة تبويب لو تريد -->
  <!-- <link rel="icon" type="image/png" href="icon.png"> -->

  <style>
    :root{
      --card-bg: rgba(255,255,255,.14);
      --card-border: rgba(255,255,255,.18);
      --text: #ffffff;
      --muted: rgba(255,255,255,.75);
      --shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% 20%, rgba(255,255,255,.20), transparent 60%),
        radial-gradient(900px 500px at 80% 40%, rgba(255,255,255,.12), transparent 60%),
        linear-gradient(135deg, #0b1b2a, #0b2a2d);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{ width:min(980px, 100%); }
    .top{
      text-align:center;
      margin-bottom:18px;
    }
    .clock{
      font-weight:800;
      font-size: clamp(44px, 7vw, 92px);
      letter-spacing: 1px;
      text-shadow: 0 6px 18px rgba(0,0,0,.35);
    }
    .sub{
      margin-top:6px;
      font-size: 16px;
      color: var(--muted);
      font-weight:600;
    }

    .card{
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 22px;
    }

    .center{
      text-align:center;
      padding: 22px 18px 18px;
    }

    .label{
      color: var(--muted);
      font-weight:700;
      letter-spacing:.2px;
    }

    .nextTitle{
      margin: 10px 0 8px;
      font-size: clamp(28px, 3.6vw, 48px);
      font-weight:900;
    }

    .nextTime{
      font-size: 18px;
      color: var(--muted);
      font-weight:700;
      margin-bottom: 14px;
    }

    .countdown{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin: 12px 0 6px;
    }
    .pill{
      width: 110px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      padding: 12px 10px;
      text-align:center;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }
    .pill .num{ font-size: 34px; font-weight:900; line-height:1; }
    .pill .txt{ margin-top:6px; font-weight:700; color: var(--muted); }

    .grid{
      margin-top: 18px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
    }
    @media (max-width: 720px){
      .grid{ grid-template-columns: 1fr; }
      .pill{ width: 100px; }
    }
    .mini{
      padding: 16px;
    }
    .mini h3{
      margin:0 0 10px;
      font-size: 18px;
      font-weight:900;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin: 6px 0;
      color: var(--muted);
      font-weight:700;
    }
    .big{
      color: var(--text);
      font-weight:900;
      font-size: 28px;
      margin-top: 8px;
    }

    .foot{
      margin-top: 16px;
      text-align:center;
      color: rgba(255,255,255,.7);
      font-weight:700;
    }
    .badge{
      display:inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="clock" id="liveClock">--:--:--</div>
      <div class="sub" id="todayLine">—</div>
      <div class="sub"><span class="badge" id="cityLine">توقيت: —</span></div>
    </div>

    <div class="card center">
      <div class="label">الأذان التالي</div>
      <div class="nextTitle" id="nextName">—</div>
      <div class="nextTime" id="nextAt">—</div>

      <div class="label" style="margin-top:10px">المدة المتبقية</div>
      <div class="countdown">
        <div class="pill">
          <div class="num" id="h">--</div>
          <div class="txt">ساعة</div>
        </div>
        <div class="pill">
          <div class="num" id="m">--</div>
          <div class="txt">دقيقة</div>
        </div>
        <div class="pill">
          <div class="num" id="s">--</div>
          <div class="txt">ثانية</div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card mini">
        <h3>وقت الإفطار اليوم</h3>
        <div class="row"><span>المغرب</span><span id="maghribTime">—</span></div>
        <div class="row"><span>المتبقي للإفطار</span><span id="maghribLeft">—</span></div>
        <div class="big" id="maghribStatus">—</div>
      </div>

      <div class="card mini">
        <h3>وقت الإمساك اليوم</h3>
        <div class="row"><span>الفجر</span><span id="fajrTime">—</span></div>
        <div class="row"><span>المتبقي للإمساك</span><span id="fajrLeft">—</span></div>
        <div class="big" id="fajrStatus">—</div>
      </div>
    </div>

    <div class="foot">
      ملاحظة: لو الأوقات عندك بصيغة <b>ص/م</b> أو <b>AM/PM</b> الكود يحولها تلقائيًا إلى 24 ساعة حتى ما يصير “المغرب صباحًا”.
    </div>
  </div>

<script>
/** ========= إعداداتك هنا ========= **/

// اسم المدينة المعروض
const CITY_NAME = "البصرة";

// أوقات اليوم (تقدر تضعها 24h مثل "17:57" أو بصيغة ص/م مثل "5:57 م")
const prayerTimesToday = {
  fajr:    "5:01 ص",
  sunrise: "6:18 ص",
  dhuhr:   "12:10 م",
  asr:     "3:35 م",
  maghrib: "5:57 م",   // الإفطار (المغرب) — أهم شيء يكون مساءً صحيح
  isha:    "7:15 م"
};

// ترتيب الصلوات لعرض "الأذان التالي"
const PRAYER_ORDER = [
  { key: "fajr",    name: "أذان الفجر" },
  { key: "dhuhr",   name: "أذان الظهر" },
  { key: "asr",     name: "أذان العصر" },
  { key: "maghrib", name: "أذان المغرب (الإفطار)" },
  { key: "isha",    name: "أذان العشاء" },
];

/** ========= دوال مساعدة ========= **/

function pad2(n){ return String(n).padStart(2,"0"); }

function formatTime12(date){
  // عرض عربي 12 ساعة
  const h = date.getHours();
  const m = date.getMinutes();
  const mer = h >= 12 ? "م" : "ص";
  const hh = ((h + 11) % 12) + 1;
  return `${hh}:${pad2(m)} ${mer}`;
}

function to24h(timeStr){
  // يدعم: "17:57" أو "5:57 م" أو "5:01 ص" أو "5:57 PM" أو "5:57 AM"
  const s = String(timeStr).trim();

  // 24h already
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;

  // Arabic ص/م
  let m = s.match(/^(\d{1,2}):(\d{2})\s*(ص|م)$/);
  if (m){
    let h = parseInt(m[1],10);
    const min = m[2];
    const mer = m[3];
    if (mer === "م" && h !== 12) h += 12;
    if (mer === "ص" && h === 12) h = 0;
    return `${pad2(h)}:${min}`;
  }

  // English AM/PM
  m = s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (m){
    let h = parseInt(m[1],10);
    const min = m[2];
    const mer = m[3].toUpperCase();
    if (mer === "PM" && h !== 12) h += 12;
    if (mer === "AM" && h === 12) h = 0;
    return `${pad2(h)}:${min}`;
  }

  throw new Error("صيغة وقت غير مدعومة: " + timeStr);
}

function makeDateToday(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  const d = new Date();
  d.setSeconds(0,0);
  d.setHours(h,m,0,0);
  return d;
}

function diffParts(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  return {h,m,s};
}

function getNextPrayer(){
  const now = new Date();

  const items = PRAYER_ORDER.map(p => {
    const t24 = to24h(prayerTimesToday[p.key]);
    return { key: p.key, name: p.name, date: makeDateToday(t24) };
  }).sort((a,b)=>a.date-b.date);

  // أول صلاة قادمة اليوم
  let next = items.find(x => x.date > now);

  // إذا خلصت صلوات اليوم، التالي فجر الغد
  if (!next){
    const fajr = items.find(x => x.key === "fajr") || items[0];
    next = { ...fajr, date: new Date(fajr.date.getTime() + 24*60*60*1000) };
    next.name = "أذان الفجر (غدًا)";
  }

  return next;
}

function update(){
  const now = new Date();

  // الساعة الكبيرة
  const hh = pad2(now.getHours());
  const mm = pad2(now.getMinutes());
  const ss = pad2(now.getSeconds());
  document.getElementById("liveClock").textContent = `${hh}:${mm}:${ss}`;

  // سطر اليوم
  const days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const todayLine = `${days[now.getDay()]}، ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById("todayLine").textContent = todayLine;
  document.getElementById("cityLine").textContent = `توقيت: ${CITY_NAME} — رمضان`;

  // عرض أوقات الفجر/المغرب
  document.getElementById("fajrTime").textContent = prayerTimesToday.fajr;
  document.getElementById("maghribTime").textContent = prayerTimesToday.maghrib;

  // حساب القادم
  const next = getNextPrayer();
  document.getElementById("nextName").textContent = next.name;
  document.getElementById("nextAt").textContent = `ساعة الأذان: ${formatTime12(next.date)}`;

  const msLeft = next.date - now;
  const parts = diffParts(msLeft);
  document.getElementById("h").textContent = pad2(parts.h);
  document.getElementById("m").textContent = pad2(parts.m);
  document.getElementById("s").textContent = pad2(parts.s);

  // المتبقي للإفطار (المغرب) والإمساك (الفجر)
  const maghribDate = makeDateToday(to24h(prayerTimesToday.maghrib));
  const fajrDate = makeDateToday(to24h(prayerTimesToday.fajr));

  // الإفطار
  if (now < maghribDate){
    const d = diffParts(maghribDate - now);
    document.getElementById("maghribLeft").textContent = `${pad2(d.h)}:${pad2(d.m)}:${pad2(d.s)}`;
    document.getElementById("maghribStatus").textContent = "المتبقي للإفطار";
  } else {
    document.getElementById("maghribLeft").textContent = "00:00:00";
    document.getElementById("maghribStatus").textContent = "انتهى";
  }

  // الإمساك (إذا الفجر فات، نعرض فجر الغد)
  let targetFajr = fajrDate;
  if (now >= fajrDate){
    targetFajr = new Date(fajrDate.getTime() + 24*60*60*1000);
  }
  const d2 = diffParts(targetFajr - now);
  document.getElementById("fajrLeft").textContent = `${pad2(d2.h)}:${pad2(d2.m)}:${pad2(d2.s)}`;
  document.getElementById("fajrStatus").textContent = (now < fajrDate) ? "المتبقي للإمساك" : "المتبقي للإمساك (غدًا)";
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
